name: Documentation

# Builds docs/ and publishes it to GitHub Pages at
# https://subh-775.github.io/Relaxify/ — the URL the app's Help entry opens.
#
# Path-filtered on purpose: the release workflow fires on v* tags and this one
# fires on docs changes, so neither can ever be waiting on the other. A docs
# typo does not rebuild an APK, and a code-only release does not redeploy a page
# that did not change.
#
# ## Why `main` and not `mobile`, where the work happens
#
# Enabling Pages creates a `github-pages` environment with a deployment branch
# policy that permits the DEFAULT branch and nothing else. A push to `mobile`
# therefore builds perfectly and is then refused at the deploy step with
# "Branch mobile is not allowed to deploy to github-pages due to environment
# protection rules" — which is the environment doing its job, not a
# misconfiguration.
#
# Publishing from the default branch is also the more honest rule: the docs
# describe the app people can actually install, and merging to `main` is what
# says a change is real. Pointing this at `mobile` instead would need `mobile`
# added under Settings → Environments → github-pages → Deployment branches, and
# until someone did that every docs commit would leave a red run behind.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # Run it by hand from the Actions tab — from `main`, for the reason above.
  workflow_dispatch:

# The three the deploy action needs. `id-token` is what lets Pages verify the
# artifact came from this workflow rather than being uploaded by anything else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, newest wins. cancel-in-progress is safe here because a
# superseded docs build has nothing to clean up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # `ci`, not `install`: the lockfile is committed and the build must use
      # exactly what was tested rather than resolving fresh versions.
      - run: npm ci

      - run: npm run build
        env:
          # GitHub Pages serves a project repo from /<repo>/. Getting this wrong
          # is silent — the page loads and every asset 404s.
          DOCS_BASE: /Relaxify/

      # No actions/configure-pages step, deliberately.
      #
      # Its whole job is to hand a framework the base path Pages will serve from,
      # via steps.<id>.outputs.base_path. This build does not read that — the base
      # is set explicitly above, because it has to be right in local builds and
      # previews too, not only in CI. So the step contributed nothing and was
      # purely a way for the run to fail: it queries the Pages REST API on every
      # run, and that call is what returned "Get Pages site failed".
      #
      # upload-pages-artifact and deploy-pages do not depend on it.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
