<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relaxify</title>
<!-- A shared playlist link: /p/?c=K7QX2M. On Android it opens the playlist in
     the app (relaxify://p/CODE, see AndroidManifest.xml), Relaxify or
     Relaxify RC; without the app the browser goes on to /get/. The code stays
     in the link only: the page shows the playlist's name, read from the
     shared playlist itself. The preview tags are static (a crawler runs no
     script), so a chat shows the app icon. -->
<meta name="description" content="Music, made simple.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="Relaxify">
<meta property="og:description" content="Music, made simple.">
<meta property="og:image" content="https://subh-775.github.io/Relaxify/logo.png">
<link rel="icon" type="image/png" href="../logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --panel: #141112;
    --line: rgba(255, 236, 240, 0.12);
    --text: #f6f1f2;
    --sub: #9b9094;
    --coral: #ff5a6e;
    --coral-hover: #ff7385;
    --coral-ink: #1c0609;
    --font: "Plus Jakarta Sans", system-ui, -apple-system, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; min-height: 100vh; margin: 0 auto; padding: max(48px, env(safe-area-inset-top)) 20px 40px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; color: inherit; text-decoration: none; }
  .icon { width: 112px; height: 112px; border-radius: 26px; display: block; }
  h1 { font-size: clamp(28px, 8vw, 36px); line-height: 1.15; font-weight: 800; letter-spacing: -0.03em; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
  .install { display: grid; gap: 12px; text-align: center; }
  .install p { margin: 0; color: var(--sub); font-size: 15px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 999px; background: var(--coral); color: var(--coral-ink); font-weight: 800; font-size: 17px; text-decoration: none; }
  .btn:hover { background: var(--coral-hover); }
  .btn:focus-visible, .card:focus-visible { outline: 2px solid var(--coral); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <a class="card" id="open" href="../get/">
    <img class="icon" src="../logo.png" alt="Relaxify">
    <h1 id="name">Relaxify</h1>
  </a>
  <div class="install">
    <p>Don't have the app?</p>
    <a class="btn" href="../get/">Install Relaxify</a>
  </div>
</main>
<script>
  (function () {
    var m = /[?&]c=([A-Za-z0-9]{6})(?:&|$)/.exec(location.search);
    var code = m ? m[1].toUpperCase() : '';
    // The app's own alphabet: no O, I, 0 or 1.
    if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
      return;
    }
    // The playlist's name, as its owner named it. A playlist that was
    // deleted reads as null, and the page keeps "Relaxify".
    fetch('https://relaxify-observability-default-rtdb.asia-southeast1.firebasedatabase.app/shared/' +
          code + '/data/name.json')
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (name) {
        if (typeof name === 'string' && name.trim()) {
          document.getElementById('name').textContent = name.trim();
          document.title = name.trim() + ' · Relaxify';
        }
      })
      .catch(function () {});
    if (!/Android/i.test(navigator.userAgent)) {
      return; // Relaxify is Android only: the install page says so.
    }
    var fallback = new URL('../get/', location.href).href;
    var intent = 'intent://p/' + code + '#Intent;scheme=relaxify;' +
      'S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
    // A tap on the playlist opens it too, for browsers that block the jump.
    document.getElementById('open').href = intent;
    location.href = intent;
  })();
</script>
</body>
</html>
